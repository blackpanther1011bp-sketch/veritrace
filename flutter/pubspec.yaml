name: veritrace
description: VeriTrace — scannez un vêtement en magasin et découvrez son impact environnemental et social.
publish_to: "none"
version: 0.1.0+1

environment:
  # Flutter 3.27 ou plus récent (Dart 3.6)
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Interface en français et en arabe (de droite à gauche) : textes de Material et sens de lecture
  flutter_localizations:
    sdk: flutter
  # Scan caméra des codes-barres (EAN-13, EAN-8, UPC-A)
  # 7.4 : coins des codes-barres + ScanWindowUtils pour la réalité augmentée légère
  mobile_scanner: ^7.4.0
  # Base de données Supabase (même projet que la web app)
  supabase_flutter: ^2.9.0
  # Historique local et accès Premium simulé
  shared_preferences: ^2.3.0
  uuid: ^4.5.0
  # Liens « Voir le calcul sur Ecobalyse » et « Voir la source des données »
  url_launcher: ^6.3.1
  # Photo de l'étiquette quand on ajoute un vêtement
  image_picker: ^1.1.2
  # Lecture du texte des étiquettes sur le téléphone (gratuit, sans connexion)
  google_mlkit_text_recognition: ^0.17.1
  # Image de la caméra en continu : lecture de l'étiquette en direct (réalité augmentée sur l'étiquette)
  camera: ^0.12.0
  # Suivi des erreurs (Sentry, région Europe) : plantages et erreurs de l'app publiée, sans donnée personnelle
  sentry_flutter: ^10.3.0
  # Réalité augmentée native (Android, ARCore) : la note posée en 3D sur le code-barres (plugin local)
  veritrace_ar:
    path: packages/veritrace_ar

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Polices de la marque (les mêmes que le site), embarquées : licence SIL OFL 1.1 (fichiers OFL-*.txt)
  fonts:
    - family: DM Sans
      fonts:
        - asset: fonts/DMSans-Regular.ttf
        - asset: fonts/DMSans-Medium.ttf
          weight: 500
        - asset: fonts/DMSans-Bold.ttf
          weight: 700
    # Police arabe (interface en arabe, lettres arabes seulement ; les lettres latines restent en DM Sans) :
    # Noto Sans Arabic 2.012 (même fichier que le site, @fontsource/noto-sans-arabic 5.3.0), licence SIL OFL 1.1
    - family: Noto Sans Arabic
      fonts:
        - asset: fonts/NotoSansArabic-Regular.ttf
        - asset: fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: Space Grotesk
      fonts:
        - asset: fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: fonts/SpaceGrotesk-Bold.ttf
          weight: 700
