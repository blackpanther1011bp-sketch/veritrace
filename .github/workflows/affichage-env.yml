name: Registre affichage environnemental

# Télécharge chaque mois le registre officiel des coûts environnementaux déclarés par les marques
# (data.gouv.fr), le découpe en blocs JSON et les publie dans la branche donnees-affichage-env.
# Supabase récupère ensuite ces blocs lui-même (fonctions registry_sync_*, voir migration 007).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 3 * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/affichage-env.yml"
      - ".github/scripts/affichage_env.py"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger le registre (data.gouv.fr)
        run: curl -fsSL --retry 3 -o "$RUNNER_TEMP/registre.csv" "https://www.data.gouv.fr/api/1/datasets/r/25321e9e-7b01-471a-b098-ffa1e3fcf906" && ls -lh "$RUNNER_TEMP/registre.csv"
      - name: Découper en blocs
        run: |
          python3 .github/scripts/affichage_env.py "$RUNNER_TEMP/registre.csv" "$RUNNER_TEMP/registre" | tee "$RUNNER_TEMP/resume.txt"
          echo "::notice title=Registre::$(cat "$RUNNER_TEMP/resume.txt")"
          du -sh "$RUNNER_TEMP/registre"
      - name: Publier dans la branche donnees-affichage-env
        run: |
          cd "$RUNNER_TEMP"
          rm -rf publi && mkdir publi && cd publi
          git init -q -b donnees-affichage-env
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data && cp -r "$RUNNER_TEMP/registre" data/registre
          printf '# Données VeriTrace\n\nBranche régénérée automatiquement chaque mois depuis le registre officiel « Affichage environnemental des vêtements » (data.gouv.fr, Licence Ouverte 2.0). Ne pas modifier à la main.\n' > README.md
          git add -A
          git commit -qm "Registre affichage environnemental du $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" donnees-affichage-env
