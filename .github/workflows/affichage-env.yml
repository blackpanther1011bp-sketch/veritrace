name: Registre affichage environnemental

# Télécharge le registre officiel des coûts environnementaux déclarés par les marques
# (data.gouv.fr, mis à jour chaque mois) et publie un aperçu dans la branche donnees-affichage-env.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/affichage-env.yml"
      - ".github/scripts/affichage_env.py"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger le registre (data.gouv.fr)
        run: curl -fsSL --retry 3 -o registre.csv "https://www.data.gouv.fr/api/1/datasets/r/25321e9e-7b01-471a-b098-ffa1e3fcf906" && ls -lh registre.csv
      - name: Aperçu
        run: |
          python3 .github/scripts/affichage_env.py registre.csv data/affichage-env | tee resume.txt
          echo "::notice title=Registre::$(cat resume.txt)"
      - name: Publier l'aperçu dans la branche donnees-affichage-env
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B donnees-affichage-env
          git add data/affichage-env
          git commit -m "Registre affichage environnemental : aperçu du $(date -u +%F)" || exit 0
          git push -f origin donnees-affichage-env
