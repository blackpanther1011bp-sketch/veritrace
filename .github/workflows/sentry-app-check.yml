name: Vérification Sentry (app Android sur émulateur)

# Lancement à la main seulement (onglet Actions → « Run workflow »). Vérifie le suivi des erreurs de l'app sans
# téléphone Android : installe le dernier APK publié (version x86_64) sur un émulateur, ouvre l'app et fait un appui
# long sur « VeriTrace » à l'accueil, ce qui envoie une erreur de test à Sentry (projet veritrace-app).
# Captures d'écran et journaux en artefact. Actions épinglées par empreinte (SHA).
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  emulateur:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Récupérer le dernier APK publié
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list --workflow flutter-android.yml --branch main --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          echo "APK de la construction $RUN"
          gh run download "$RUN" -n veritrace-android-apk -D apk
          ls -lh apk

      - name: Activer l'accélération matérielle (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Émulateur, installation et appui long sur « VeriTrace »
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/sentry_app_check.sh apk/app-x86_64-release.apk sentry-check

      - name: Captures d'écran et journaux
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-sentry-app
          path: sentry-check/
          if-no-files-found: warn
          retention-days: 7
