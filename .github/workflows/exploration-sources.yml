name: Étude de sources de codes-barres

# Étude ponctuelle, lancée à la main : mesure ce que des bases ouvertes de codes-barres apporteraient
# (vêtements seulement), sans rien envoyer à VeriTrace. Résultat dans le résumé de l'exécution.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nudger:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: donnees-affichage-env
          path: donnees
      # Le site de Nudger refuse les téléchargements depuis GitHub (erreur 403) : on prend la copie déposée par
      # Nudger sur Zenodo (novembre 2024, licence CC BY 4.0).
      - name: Télécharger la base Nudger (copie Zenodo)
        run: |
          curl -fL --retry 5 --retry-delay 20 -C - -o "$RUNNER_TEMP/gtin.zip" "https://zenodo.org/records/14035436/files/gtin-open-data.zip?download=1"
          ls -lh "$RUNNER_TEMP/gtin.zip" && unzip -l "$RUNNER_TEMP/gtin.zip"
      - name: Mesurer
        run: unzip -p "$RUNNER_TEMP/gtin.zip" | python3 .github/scripts/explore_sources.py nudger - donnees/data/registre "$RUNNER_TEMP/nudger-vetements.csv.gz" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nudger-vetements
          path: ${{ runner.temp }}/nudger-vetements.csv.gz
          retention-days: 7
