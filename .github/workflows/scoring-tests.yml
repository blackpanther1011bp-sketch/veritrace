name: Tests du calcul Ecobalyse

on:
  push:
    paths:
      - "supabase/functions/**"
      - "web/src/lib/**"
      - "web/server/**"
      - "web/api/**"
      - "web/vercel.json"
      - ".github/workflows/scoring-tests.yml"
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Tests unitaires du cœur de calcul
        run: node --experimental-strip-types --test supabase/functions/ecobalyse-score/core.test.ts supabase/functions/outils/outils.test.ts
      - name: Tests unitaires du site web (lecture en direct, comparateur, note sociale, page de partage des passeports)
        run: node --experimental-strip-types --test web/src/lib/labelLive.test.ts web/src/lib/compare.test.ts web/src/lib/social.test.ts web/server/partage.test.ts
