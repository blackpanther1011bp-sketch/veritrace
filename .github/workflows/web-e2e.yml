name: Site web (tests de parcours)

# Construit le site puis le parcourt dans un vrai navigateur (taille téléphone) : scan, fiche, alternatives,
# signalement, pages légales et formulaire de contact, accessibilité (WCAG 2.2 AA), en-têtes de sécurité.
# Supabase est simulé dans les tests : rien n'est écrit dans la vraie base.
on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web-e2e.yml"
  pull_request:
    paths:
      - "web/**"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Installer le navigateur de test
        run: npx playwright install --with-deps chromium

      - name: Construire le site
        run: npm run build

      - name: Lancer les tests de parcours
        run: npx playwright test

      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-tests-site
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
